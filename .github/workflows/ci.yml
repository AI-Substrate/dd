name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Version-independent static gates — run ONCE here, not per Node matrix leg.
  # Pure shell + the runner's preinstalled Node, so this finishes in seconds.
  static-gates:
    name: static-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package scope matches repo owner
        run: |
          NAME=$(node -p "require('./package.json').name")
          SCOPE=${NAME#@}; SCOPE=${SCOPE%%/*}
          OWNER=${GITHUB_REPOSITORY%%/*}
          echo "package='$NAME' scope='$SCOPE' owner='$OWNER'"
          lc() { printf %s "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ "$(lc "$SCOPE")" != "$(lc "$OWNER")" ]; then
            echo "::error title=scope-owner::package scope '@$SCOPE' != repo owner '$OWNER'"
            exit 1
          fi
          echo "OK: scope matches owner (case-insensitive)"

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # FULL history, deliberately. The handover-packet drift check derives
          # `git log -1 -- <source>` to stamp each embedded copy with the commit
          # that last changed it. At the default fetch-depth of 1 that returns
          # the checkout SHA for every path — a wrong stamp rather than a missing
          # one — so the check reds while blaming the packet. The generator now
          # refuses to run on a shallow clone; this gives it the history it needs.
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The SAME gates `just checks` runs locally, in the SAME order, so CI and
      # local can't drift. Split into steps here only so a failure names itself.
      #
      # That parity is not a promise in a comment — it is asserted by
      # `test/ci-parity.test.ts`, which reads this file and the justfile and
      # fails if a gate exists in one and not the other. The comment said
      # "three gates" while the recipe ran five; the docs-drift gate was missing
      # here for four commits and nothing could see it (plan 001 phase 4
      # tk-0001). A claim about CI now has a test, like every other claim.
      - name: Lint (biome)
        run: npx biome check .

      - name: Build (tsc emit) — prerequisite for the bin smoke test
        run: npm run build

      - name: Typecheck (src + test)
        run: npm run typecheck

      - name: Docs drift (baked `dd docs` corpus)
        run: npm run check:dd-docs

      - name: Orient drift (government/orient-local.md repo-state block)
        run: node scripts/gen-orient-state.mjs --check

      - name: Handover-packet drift (embedded guardrails + standing constraints)
        run: node scripts/gen-handover-embeds.mjs --check

      - name: Exports reachability (map is consumable, not merely declared)
        run: node scripts/exports-reachability-probe.mjs

      # Was `npm audit --audit-level=high || true` and named "(advisory)". That
      # command exits 1 on this tree — six high advisories — so the step reported
      # success on every commit while printing them. A step that cannot fail is
      # not a gate. Now blocks on production advisories and on any DEV advisory
      # that has become fixable; unfixable dev-only ones are printed, not hidden.
      - name: Audit (blocks on actionable advisories)
        run: node scripts/audit-gate.mjs

      - name: Self-host (dd renders this repo's own documents)
        run: ./scripts/self-host-check.sh

      - name: Test (vitest + coverage)
        run: npx vitest run --coverage

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-node${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: error


  # Packaging smoke: pack the tarball, install it into a clean temp project, and
  # invoke the installed `dd` bin through its symlink. Guards the two things unit
  # tests structurally cannot see — the `files` allowlist and the bin execute bit.
  package-smoke:
    name: package-smoke
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The committed gate: clone HEAD clean, pack (prepack builds dist),
      # install the tarball into a throwaway project, and drive the INSTALLED
      # bin — including the jiti-loaded custom render type, with a non-vacuity
      # control that fails if the adapter output could appear without it. Same
      # script a developer runs as `just pack-gate`, so CI and local cannot
      # drift into testing different things.
      - name: Pack gate (scripts/pack-gate.sh)
        run: ./scripts/pack-gate.sh

      - name: Publish dry-run — scoped name + bin/dist packed
        run: |
          # Dry-run validates the publish path/registry config (exits 0 without
          # auth — never contacts the registry) and proves the scoped name plus
          # bin/dist are in the packed set.
          npm publish --dry-run 2>&1 | tee /tmp/pub.txt
          grep -q "registry.npmjs.org" /tmp/pub.txt \
            || { echo "::error title=dry-run::not targeting the public npm registry"; exit 1; }
          grep -qi "public access" /tmp/pub.txt \
            || { echo "::error title=dry-run::not publishing with public access"; exit 1; }
          npm pack --dry-run --json > /tmp/pack.json
          jq -e '.[0].name == "@ai-substrate/dd"' /tmp/pack.json >/dev/null \
            || { echo "::error title=dry-run::scoped name mismatch"; exit 1; }
          jq -e '[.[0].files[].path] | any(test("bin/dd\\.js"))' /tmp/pack.json >/dev/null \
            || { echo "::error title=dry-run::bin not packed"; exit 1; }
          jq -e '[.[0].files[].path] | any(startswith("dist/"))' /tmp/pack.json >/dev/null \
            || { echo "::error title=dry-run::dist not packed"; exit 1; }
          echo "OK: scoped name + bin + dist present; targeting the public npm registry"

      - name: Pack and smoke-test the installed bin
        run: |
          set -euo pipefail
          # Deterministic tarball capture: --json + jq, with a mechanical *.tgz
          # assert so ANY lifecycle stdout leak fails loudly instead of silently
          # corrupting $TARBALL.
          TARBALL="$(npm pack --json | jq -r '.[0].filename')"
          [[ "$TARBALL" == *.tgz ]] || { echo "ERROR: npm pack capture corrupt: '$TARBALL'"; exit 1; }
          echo "Packed: $TARBALL"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null 2>&1
          # --omit=dev mirrors a real consumer install: every dependency the bin
          # needs at runtime must resolve without devDependencies present.
          npm install --omit=dev "$GITHUB_WORKSPACE/$TARBALL"
          echo "Installed bin symlink:"
          ls -l node_modules/.bin/dd

          echo "dd --version:"
          ./node_modules/.bin/dd --version

          echo "dd version (ok envelope, exit 0):"
          ./node_modules/.bin/dd --json version | tee version.json
          jq -e '.status == "ok"' version.json >/dev/null
          jq -e '.command == "version" and (.timestamp | type) == "string"' version.json >/dev/null

          echo "dd status (complete port ledger, exit 0):"
          set +e
          ./node_modules/.bin/dd --json status > status.json; code=$?
          set -e
          cat status.json
          [ "$code" -eq 0 ] || { echo "::error title=smoke::a complete ledger must exit 0, got $code"; exit 1; }
          # The ledger is derived from the verbs actually registered on the
          # program, so this asserts the SHIPPED tarball carries a working CLI —
          # not that a constant was edited. While verbs were still landing this
          # read `unconfigured`/exit 2; it flipped when the last one registered.
          jq -e '.status == "ok"' status.json >/dev/null
          jq -e '(.data.remaining | length) == 0' status.json >/dev/null
          jq -e '(.data.ported | length) == 10' status.json >/dev/null

          echo "dd no-such-verb (error envelope, exit 1):"
          set +e
          ./node_modules/.bin/dd --json no-such-verb > err.json; code=$?
          set -e
          cat err.json
          [ "$code" -eq 1 ] || { echo "::error title=smoke::error must exit 1, got $code"; exit 1; }
          jq -e '.status == "error" and .error.code == "E001"' err.json >/dev/null

          echo "OK: installed bin honours the envelope contract and the exit-code mapping"

  # Stable, matrix-independent required check for branch protection. Always runs
  # and fails if any required job failed or was cancelled.
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: [static-gates, build-test, package-smoke]
    if: always()
    steps:
      - name: Verify required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
      - name: All required jobs passed
        run: echo "All required jobs passed."
